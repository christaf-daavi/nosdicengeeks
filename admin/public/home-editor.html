<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon-preview/favicon.ico" />
  <link rel="icon" type="image/png" href="/favicon-preview/favicon.png" />
  <title>NosDicenGeeks</title>
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    .card__title { font-size: .95rem; font-weight: 700; color: var(--text-heading); margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .card__title svg { opacity: .6; }
    .card + .card { margin-top: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }

    .topic-item {
      display: grid;
      grid-template-columns: 70px 1fr 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
    }
    .topic-item .form-group { margin-bottom: 0; }
    .topic-item__actions { display: flex; flex-direction: column; gap: 4px; }
    @media (max-width: 768px) {
      .topic-item { grid-template-columns: 1fr; }
      .topic-item__actions { flex-direction: row; }
    }

    .save-status { font-size: .75rem; color: var(--text-muted); }

    .save-bar {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 16px 0 0;
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__brand-icon">G</div>
      <div class="sidebar__brand-name">NosDicenGeeks<span>Admin Panel</span></div>
    </div>
    <nav class="sidebar__nav">
      <a href="/dashboard.html" class="nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Posts
      </a>
      <a href="/pages.html" class="nav-item active">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Páginas
      </a>
      <a href="/menu-editor.html" class="nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        Menú Principal
      </a>
      <a href="/media.html" class="nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Media
      </a>
      <a href="/settings.html" class="nav-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configuración
      </a>
    </nav>
    <div class="sidebar__footer">
      <button class="nav-item" onclick="logout()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" id="menuToggle" aria-label="Menú">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a href="/pages.html" class="btn btn-ghost btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Páginas
        </a>
        <span style="color:var(--text-muted);">/</span>
        <span class="topbar__title">Editor de Inicio</span>
      </div>
      <div id="topAlert" class="alert" style="margin:0;padding:6px 12px;font-size:.8rem;"></div>
    </div>

    <div class="content" style="max-width:820px;">

      <!-- Hero -->
      <div class="card">
        <div class="card__title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Hero
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="heroTitle">Título</label>
            <input type="text" id="heroTitle" placeholder="Bienvenido a" />
          </div>
          <div class="form-group">
            <label for="heroTitleAccent">Título destacado (accent)</label>
            <input type="text" id="heroTitleAccent" placeholder="NosDicenGeeks" />
          </div>
        </div>
        <div class="form-group">
          <label for="heroSubtitle">Subtítulo</label>
          <textarea id="heroSubtitle" rows="2" placeholder="Tecnología, cultura geek…"></textarea>
        </div>
      </div>

      <!-- Topics -->
      <div class="card">
        <div class="card__title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          ¿De qué hablamos?
        </div>
        <div class="form-group">
          <label for="topicsSectionTitle">Título de la sección</label>
          <input type="text" id="topicsSectionTitle" placeholder="¿De qué hablamos?" />
        </div>
        <label style="display:block;margin-bottom:8px;">Temas</label>
        <div id="topicsList"></div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="addTopic()" style="margin-top:4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Agregar tema
        </button>
      </div>

      <!-- Últimas entradas -->
      <div class="card">
        <div class="card__title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Sección "Últimas entradas"
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="latestPostsTitle">Título</label>
            <input type="text" id="latestPostsTitle" placeholder="Últimas entradas" />
          </div>
          <div class="form-group">
            <label for="latestPostsSubtitle">Subtítulo</label>
            <input type="text" id="latestPostsSubtitle" placeholder="Lo más reciente del universo geek" />
          </div>
        </div>
      </div>

      <div class="save-bar">
        <button class="btn btn-primary" id="saveBtn" onclick="saveHome()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar y publicar
          <span class="spinner" id="saveSpinner"></span>
        </button>
        <span class="save-status" id="saveStatus"></span>
      </div>
      <pre id="buildLog" class="build-log"></pre>

    </div>
  </main>
</div>

<script src="/js/auth.js"></script>
<script src="/js/home-editor.js"></script>
</body>
</html>
